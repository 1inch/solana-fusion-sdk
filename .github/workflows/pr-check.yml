name: PR validation

on:
  pull_request:

env:
  ANCHOR_VER: 0.30.1
  SOLANA_CLI_VER: 2.1.13

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Yarn # required for integration tests
        run: npm install -g yarn

      - name: Cache Solana CLI tools  # cache solana cli-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/solana/
            ~/.local/share/solana/
          key: solana-cli-${{ runner.os }}-build-${{ env.SOLANA_CLI_VER }}

      - name: Install Solana CLI (beta) # required for integration tests
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_CLI_VER }}/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./contracts/fusion-contract"

      - name: Cache Rustup
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
          key: rustup-${{ runner.os }}

      - name: Install Anchor
        run: npm i -g @coral-xyz/anchor-cli@${{ env.ANCHOR_VER }}
        shell: bash

      - name: Install Dependencies
        run: pnpm install

      - name: Linter
        run: pnpm lint

      - name: Types
        run: pnpm lint:types

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

  # Inlined from 1inch/workflows trivy-scan-v1 (v1.0.8). This repo is public and
  # GitHub cannot resolve that private reusable workflow here, which fails the
  # entire PR validation run at startup (0 jobs) — including the check job.
  # Same fix as fusion-sdk, cross-chain-sdk and limit-order-sdk pr-check.yml.
  dependabot-audit:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy scan (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          skip-files: .npmrc
          timeout: 10m0s
          limit-severities-for-sarif: false
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Fail on vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          skip-files: .npmrc
          timeout: 10m0s
          format: table
          exit-code: '1'
          skip-setup-trivy: true
